// Android is the default target so `mvn -f mobile/pom.xml clean test` works with no
// extra flags, matching every other module. Run iOS with `-Denv=ios`.
// The `android` profile is kept as an explicit alias for `-Denv=android`.
default {
  appium {
    serverUrl = "http://127.0.0.1:4723"
    platformName = "android"
    platformVersion = "16"
    deviceName = "emulator-5554"
    automationName = "UiAutomator2"
    appPackage = "com.android.settings"
    appActivity = ".Settings"
  }
}

android {
  appium {
    platformName = "android"
    platformVersion = "16"
    deviceName = "emulator-5554"
    automationName = "UiAutomator2"
    appPackage = "com.android.settings"
    appActivity = ".Settings"
  }
}

ios {
  appium {
    platformName = "ios"
    platformVersion = "17.2"
    deviceName = "iPhone 15"
    automationName = "XCUITest"
    appPackage = "com.apple.Preferences"
    appActivity = ""
  }
}

