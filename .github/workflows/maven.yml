name: CI for Playwright tests

on:
  push:
    branches: [ "default" ]
  pull_request:
    branches: [ "default" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 1. Download Allure history from the cache of the previous run
      - name: Cache Allure History
        uses: actions/cache@v4
        with:
          path: ui-playwright/allure-history
          # Dynamic key ensures the cache is updated at the end of the job
          key: allure-history-${{ github.run_id }}
          restore-keys: |
            allure-history-

      - name: Install Playwright dependencies
        run: npx playwright install-deps

      - name: Build project and install dependencies
        run: mvn clean install -pl core -DskipTests -am

      # 2. Restore history to the target directory (folder is already downloaded from cache)
      - name: Restore Allure History
        run: |
          mkdir -p ui-playwright/allure-history
          mvn antrun:run@restore-allure-history -pl ui-playwright
        continue-on-error: true

      - name: Run tests for ui-playwright module
        run: mvn clean test -pl ui-playwright -Denv=qa

      - name: Generate Allure Environment Properties
        if: always()
        run: |
          mkdir -p ui-playwright/target/allure-results
          echo "Environment=QA" >> ui-playwright/target/allure-results/environment.properties
          echo "Framework=Playwright" >> ui-playwright/target/allure-results/environment.properties
          echo "Branch=${{ github.ref_name }}" >> ui-playwright/target/allure-results/environment.properties
          echo "OS=${{ runner.os }}" >> ui-playwright/target/allure-results/environment.properties

      # 3. Generate report using Maven (simple-elf removed)
      - name: Generate Allure Report
        if: always()
        run: mvn allure:report -pl ui-playwright

      # 4. Copy the fresh history back to the folder for caching
      - name: Save Allure History
        if: always()
        run: mvn antrun:run@copy-allure-history -pl ui-playwright

      # 5. Upload the artifact for GitHub Pages directly from the Maven folder
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: ui-playwright/target/site/allure-maven-plugin/

      # 6. Deploy the artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: always()