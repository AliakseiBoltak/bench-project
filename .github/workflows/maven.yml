name: CI for Playwright tests

on:
  push:
    branches: [ "default" ]
  pull_request:
    branches: [ "default" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 1. Pull previous Allure history directly from the live GitHub Pages site
      - name: Restore Allure History from GitHub Pages
        continue-on-error: true
        run: |
          mkdir -p ui-playwright/allure-history
          
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          BASE_URL="https://${OWNER}.github.io/${REPO}/history"
          
          echo "Downloading history from: $BASE_URL"
          
          FILES=("history.json" "history-trend.json" "categories-trend.json" "duration-trend.json" "retry-trend.json")
          
          for file in "${FILES[@]}"; do
            # Use curl to download the file and capture the HTTP status code
            HTTP_STATUS=$(curl -s -L -o "ui-playwright/allure-history/$file" -w "%{http_code}" "$BASE_URL/$file" || echo "FAIL")
          
            # Check if the download was successful and the file is not empty
            if [ "$HTTP_STATUS" != "200" ] || [ ! -s "ui-playwright/allure-history/$file" ]; then
              echo "⚠️ Failed to download $file (HTTP status: $HTTP_STATUS). Deleting corrupted file."
              rm -f "ui-playwright/allure-history/$file"
            else
              echo "✅ Successfully downloaded $file"
            fi
          done

      - name: Install Playwright dependencies
        run: npx playwright install-deps

      - name: Build project and install dependencies
        run: mvn clean install -pl core -DskipTests -am

      # 2. Copy history into allure-results so Maven/Allure can pick it up
      - name: Restore History to Results
        run: |
          mvn antrun:run@restore-allure-history -pl ui-playwright
        continue-on-error: true

      - name: Run tests for ui-playwright module
        run: mvn clean test -pl ui-playwright -Denv=qa

      - name: Generate Allure Environment Properties
        if: always()
        run: |
          mkdir -p ui-playwright/target/allure-results
          echo "Environment=QA" >> ui-playwright/target/allure-results/environment.properties
          echo "Framework=Playwright" >> ui-playwright/target/allure-results/environment.properties
          echo "Branch=${{ github.ref_name }}" >> ui-playwright/target/allure-results/environment.properties
          echo "OS=${{ runner.os }}" >> ui-playwright/target/allure-results/environment.properties

      # 3. Generate report using Maven (Allure will automatically process the history)
      - name: Generate Allure Report
        if: always()
        run: mvn allure:report -pl ui-playwright

      # 4. Save the fresh history generated by Allure back to the local folder
      - name: Save Allure History
        if: always()
        run: mvn antrun:run@copy-allure-history -pl ui-playwright

      # 5. Upload the artifact for GitHub Pages (includes the updated history folder)
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: ui-playwright/target/site/allure-maven-plugin/

      # 6. Deploy the artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: always()