name: CI for Playwright tests

on:
  push:
    branches: [ "default" ]
  pull_request:
    branches: [ "default" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install Playwright dependencies
        run: npx playwright install-deps

      - name: Build project and install dependencies
        run: mvn clean install -pl core -DskipTests -am

      - name: Run tests for ui-playwright module
        run: mvn clean test -pl ui-playwright

      - name: Restore Allure history
        run: mvn antrun:run@restore-allure-history
        continue-on-error: true

      - name: Generate Allure Report
        run: mvn allure:report

      - name: Copy Allure history
        run: mvn antrun:run@copy-allure-history
        continue-on-error: true

      - name: Upload Allure Report Artifact
        uses: actions/upload-artifact@v4
        with:
            name: allure-report
            path: target/site/allure-maven-plugin/
            retention-days: 30
