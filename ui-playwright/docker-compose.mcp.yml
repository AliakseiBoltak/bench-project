version: '3.8'

services:
  mcp:
    # Placeholder image - replace with official MCP/server image if available
    image: playwright/mcp:latest
    container_name: playwright-mcp
    ports:
      - "8000:8000"
    environment:
      - MCP_LOG_LEVEL=info
    restart: unless-stopped
    # If the image requires additional volumes or configs, add them here
    # volumes:
    #   - ./mcp-data:/data

# Usage:
#  docker compose -f docker-compose.mcp.yml up -d
# The server will be available at http://localhost:8000 by default. Update PLAYWRIGHT_MCP_URL accordingly.
