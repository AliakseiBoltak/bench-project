status = warn
name = PropertiesConfig

# Console Appender
appender.console.type = Console
appender.console.name = Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n

# File Appender - all INFO and above also goes to target/logs/test.log
appender.file.type = File
appender.file.name = FileLogger
appender.file.fileName = target/logs/test.log
appender.file.append = true
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n

# Third-party loggers are capped at INFO so the file stays readable
logger.appium.name = io.appium
logger.appium.level = info
logger.selenium.name = org.openqa.selenium
logger.selenium.level = info

# Root Logger
rootLogger.level = info
rootLogger.appenderRefs = console, file
rootLogger.appenderRef.console.ref = Console
rootLogger.appenderRef.file.ref = FileLogger

